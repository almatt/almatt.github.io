<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    window.addEventListener('beforeunload', (event) => {
    const message = "Вы уверены, что хотите покинуть страницу? Несохраненные данные будут потеряны.";

    event.preventDefault();
    event.returnValue = message; // Для Chrome

    return message;
});
        </script>
</body>
</html>
